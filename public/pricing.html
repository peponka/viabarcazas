<body>
  <nav class="nav">
    <a id="brandLink" class="brand" href="index.html">ViaBarcazas</a>
    <div class="actions">
      <div class="languages" aria-label="Language">
        <a class="lang" data-lang="es" href="pricing.html" title="Español">ES</a>
        <a class="lang" data-lang="en" href="pricing.html?lang=en" title="English">EN</a>
        <a class="lang" data-lang="pt" href="pricing.html?lang=pt" title="Português">PT</a>
      </div>
      <a id="salesLink" class="cta" href="#contacto">Hablar con ventas</a>
    </div>
  </nav>
  <header class="hero"><h1 id="heroTitle">Calcula tu plan.</h1><p id="heroText"></p></header>
  <main>
    <section class="calculator">
      <h2 id="calculatorTitle"></h2><p id="calculatorText"></p>
      <label id="unitsLabel" class="label" for="units"></label>
      <div class="stepper"><button type="button" data-step="-1">-</button><input id="units" type="number" min="0" value="1"><button type="button" data-step="1">+</button></div>
      <div class="total"><span id="fleetIntro"></span><strong id="unitCount">1</strong><span id="unitName"></span></div>
      <div class="live" aria-live="polite"><span id="activeRule" class="eyebrow"></span><strong id="calculation"></strong><p id="calculationNote"></p></div>
      <div class="billing"><label><input type="radio" name="billing" value="monthly" checked><span id="monthlyOption"></span></label><label><input type="radio" name="billing" value="annual"><span id="annualOption"></span></label></div>
      <div id="result" class="result" aria-live="polite"></div>
      <div class="proposal-action"><button id="checkoutButton" class="button" type="button"></button></div>
    </section>
    <section class="plans"><h2 id="plansTitle"></h2><div id="plans" class="grid"></div></section>
    <section class="plans"><h2 id="combosTitle"></h2><p id="combosText" style="max-width:700px;margin:0 auto 30px;text-align:center;color:var(--muted);font-size:14px"></p><div id="combos" class="grid"></div></section>
    <p id="note" class="note"></p>
    <section id="contacto" class="contact">
      <h2 id="contactTitle"></h2><p id="contactText"></p>
      <form id="proposalForm" novalidate>
        <div class="formgrid">
          <div class="field"><label id="nameLabel" for="name"></label><input id="name" required autocomplete="name"></div>
          <div class="field"><label id="companyLabel" for="company"></label><input id="company" required autocomplete="organization"></div>
          <div class="field"><label id="emailLabel" for="email"></label><input id="email" required type="email" autocomplete="email"></div>
          <div class="field"><label id="countryLabel" for="country"></label><select id="country" required></select></div>
          <div class="field wide"><label id="messageLabel" for="message"></label><textarea id="message"></textarea></div>
        </div>
        <p id="quoteSummary" class="form-note"></p>
        <button id="formButton" class="button" type="submit"></button><div id="formStatus" class="status" role="status"></div>
      </form>
    </section>
  </main>
  <footer id="footer" class="footer-note"></footer>
  <div id="payModal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <button type="button" id="modalClose" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalOrderView">
        <h3 id="modalOrderTitle"></h3>
        <p id="modalOrderSummary" class="modal-summary"></p>
        <div class="field"><label id="cardNameLabel" for="cardName"></label><input id="cardName" autocomplete="cc-name"></div>
        <div class="field"><label id="cardNumberLabel" for="cardNumber"></label><input id="cardNumber" inputmode="numeric" placeholder="4242 4242 4242 4242" autocomplete="cc-number"></div>
        <div class="modal-row">
          <div class="field"><label id="cardExpiryLabel" for="cardExpiry"></label><input id="cardExpiry" placeholder="MM/AA" autocomplete="cc-exp"></div>
          <div class="field"><label id="cardCvcLabel" for="cardCvc"></label><input id="cardCvc" inputmode="numeric" placeholder="123" autocomplete="cc-csc"></div>
        </div>
        <button id="confirmPayButton" class="button" type="button"></button>
        <p id="simulatedNote" class="modal-note"></p>
      </div>
      <div id="modalProcessingView" style="display:none">
        <div class="spinner" aria-hidden="true"></div>
        <p id="processingText"></p>
      </div>
      <div id="modalSuccessView" style="display:none">
        <div class="success-check">&#10003;</div>
        <h3 id="successTitle"></h3>
        <p id="successText"></p>
        <a id="goToAccountLink" class="button" href="app.html?mode=register"></a>
      </div>
    </div>
  </div>

      pt:{title:'Calculadora de frota | ViaBarcazas',sales:'Falar com vendas',hero:'Calcule seu plano.',heroText:'Cada barcaça e cada rebocador conta como sua própria unidade faturável. O total é atualizado ao vivo.',calc:'Calcule sua frota.',calcText:'Informe o total de barcaças e rebocadores que você vai gerenciar. Cada um é faturado como uma unidade, sem vagas vazias.',units:'Total de barcaças e rebocadores',fleet:'Sua frota tem',unit:'unidade faturável',unitsWord:'unidades faturáveis',rule:'Regra ativa',monthly:'Pagamento mensal',annual:'Pré-pagamento anual (10% de desconto)',pay:'Pagar e ativar meu plano',modalOrderTitle:'Resumo do seu plano',cardName:'Nome no cartão',cardNumber:'Número do cartão',cardExpiry:'Validade',cardCvc:'CVC',confirmPay:'Confirmar pagamento (simulado)',processing:'Processando pagamento simulado…',successTitle:'Pagamento simulado com sucesso!',successText:'Seu plano está ativo. Crie sua conta para começar a usar o ViaBarcazas.',goToAccount:'Criar minha conta',simulatedNote:'Este é um pagamento de demonstração, nenhuma cobrança real é feita.',plans:'Preços por unidade e faixa',note:'Mais de 150 unidades: proposta personalizada. Piloto comercial: 60 dias, até 15 embarcações, USD 3.000.',contact:'Mais de 150 unidades ou precisa de algo sob medida?',contactText:'Para frotas grandes ou condições especiais, montamos uma proposta sob medida. Conte-nos seu caso e responderemos com os detalhes.',name:'Nome *',company:'Empresa *',email:'E-mail *',country:'País *',message:'Comentário (opcional)',send:'Enviar solicitação comercial',quote:'Resumo da sua seleção:',mailSubject:'Consulta de plano ViaBarcazas',formOk:'Solicitação registrada. Entraremos em contato com uma proposta.',footer:'ViaBarcazas | Gestão de frotas para a Hidrovia Paraguai-Paraná',initial:'Preço inicial',custom:'Proposta personalizada',perUnit:'por unidade / mês',monthlyPrice:'Preço mensal real',unitCost:'Custo por unidade',base:'Preço base sem desconto',saving:'Economia por faixa',a     }[lang];
    var $=function(id){return document.getElementById(id)}, money=function(n){return 'USD '+Number(n||0).toLocaleString('en-US')}, value=function(){return Math.max(0,Number($('units').value)||0)}, selected=function(n){return tiers.filter(function(t){return n>=t.min&&n<=t.max})[0]||null}, annual=function(){return document.querySelector('input[name="billing"]:checked').value==='annual'}, set=function(id,v){$(id).textContent=v};
    function staticText(){

      var monthly=n*plan.rate,base=n*tiers[0].rate,annualPrice=monthly*12*.9,charged=isAnnual?annualPrice:monthly;
      set('calculation',n+' '+text.calcLine+' '+money(plan.rate)+' = '+money(monthly)+' '+text.perMonth);
      $('calculationNote').textContent=(isAnnual?text.annualPrepay+': '+money(annualPrice)+' / '+(lang==='en'?'year':lang==='pt'?'ano':'año'):text.monthly);
      $('result').innerHTML='<div class="box"><span>'+text.monthlyPrice+'</span><b>'+money(monthly)+' '+text.perMonth+'</b></div><div class="box"><span>'+text.unitCost+'</span><b>'+money(plan.rate)+' '+text.perMonth+'</b></div><div class="box"><span>'+text.base+'</span><b>'+money(base)+' '+text.perMonth+'</b></div><div class="box"><span>'+text.saving+'</span><b>'+money(base-monthly)+' '+text.perMonth+'</b></div><div class="box"><span>'+text.annualTotal+'</span><b>'+money(monthly*12)+' / '+(lang==='en'?'year':lang==='pt'?'ano':'año')+'</b></div><div class="box"><span>'+text.annualPrepay+'</span><b>'+money(annualPrice)+' / '+(lang==='en'?'year':lang==='pt'?'ano':'año')+'</b></div><div class="box wide"><span>'+text.annualSaving+'</span><b>'+money(monthly*12-annualPrice)+'</b></div>';
      $('quoteSummary').textContent=text.quote+' '+n+' '+text.unitsWord+' · '+money(charged)+(isAnnual?' / '+(lang==='en'?'year':lang==='pt'?'ano':'año'):' '+text.perMonth)+'.';renderPlans(plan);
    }
    document.querySelectorAll('[data-step]').forEach(function(b){b.addEventListener('click',function(){$('units').value=Math.max(0,value()+Number(b.dataset.step));calculate()})});
    $('units').addEventListener('input',calculate);document.querySelectorAll('input[name="billing"]').forEach(function(i){i.addEventListener('change',calculate)});
    function openPayModal(units,rate,total,isAnnual){
      var periodWord=lang==='en'?'year':lang==='pt'?'ano':'año';
      $('modalOrderSummary').textContent=units+' '+(units===1?text.unit:text.unitsWord)+' · '+money(rate)+' '+text.perUnit+' · '+money(total)+' '+(isAnnual?'/'+periodWord:text.perMonth);
      $('goToAccountLink').href='app.html?mode=register&units='+units+'&billing='+(isAnnual?'annual':'monthly');
      $('cardName').value='';$('cardNumber').value='';$('cardExpiry').value='';$('cardCvc').value='';
      $('modalOrderView').style.display='block';$('modalProcessingView').style.display='none';$('modalSuccessView').style.display='none';
      $('payModal').style.display='flex';
    }
    $('checkoutButton').addEventListener('click',function(){
      var n=value(),plan=selected(n);
      if(!plan){location.hash='contacto';return}
      var isAnnual=annual(),total=isAnnual?n*plan.rate*12*.9:n*plan.rate;
      openPayModal(n,plan.rate,total,isAnnual);
    });
    function closePayModal(){$('payModal').style.display='none'}
    $('modalClose').addEventListener('click',closePayModal);
    $('payModal').addEventListener('click',function(e){if(e.target.id==='payModal')closePayModal()});
    $('confirmPayButton').addEventListener('click',function(){
      $('modalOrderView').style.display='none';$('modalProcessingView').style.display='block';
      setTimeout(function(){$('modalProcessingView').style.display='none';$('modalSuccessView').style.display='block'},900);
    });
    $('cardNumber').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim()});
    $('cardExpiry').addEventListener('input',function(){var v=this.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);this.value=v});
    $('cardCvc').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,4)});
    $('proposalForm').addEventListener('submit',function(e){e.preventDefault();if(!$('proposalForm').checkValidity()){$('proposalForm').reportValidity();return}$('formStatus').textContent=text.formOk;$('formStatus').style.display='block'});
    staticText();calculate();renderCombos();
  })();
  </script>
</body>
</html>
